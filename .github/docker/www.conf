; Panasaurus — PHP-FPM pool configuration (nginx, unix socket)
[global]
pid = /var/run/php/php-fpm.pid
error_log = /proc/self/fd/2

[www]
user = nginx
group = nginx

listen = /var/run/php/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.process_idle_timeout = 30s
pm.max_requests = 800

; Fast, safe request handling
request_terminate_timeout = 300s
request_slowlog_timeout = 15s
slowlog = /app/storage/logs/php-fpm-slow.log

php_admin_value[error_log] = /app/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 512M

catch_workers_output = yes
decorate_workers_output = no
